name: Build PS5 payload

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18-dev unzip
      - name: Download verified PS5 payload SDK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip \
            --output /tmp/ps5-payload-sdk.zip
          echo '4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0  /tmp/ps5-payload-sdk.zip' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sdk"
          unzip -q /tmp/ps5-payload-sdk.zip -d "$RUNNER_TEMP/sdk"
      - name: Test protocol on host
        run: make HOST=1 test
      - name: Build PS5 ELF
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          make HOST=1 clean
          make PS5_PAYLOAD_SDK="$RUNNER_TEMP/sdk/ps5-payload-sdk"
          file ps5-localsend.elf
          readelf -h ps5-localsend.elf | grep -E 'Class:|Machine:|Type:'
          sha256sum ps5-localsend.elf > ps5-localsend.elf.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-localsend-elf
          path: |
            ps5-localsend.elf
            ps5-localsend.elf.sha256
      - name: Attach payload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            printf '%s\n' 'ps5-localsend ELF source and license'
            printf '%s\n' 'License: GPL-3.0-only'
            printf 'This release source: https://github.com/%s/archive/refs/tags/%s.tar.gz\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '%s\n' 'PS5 payload SDK v0.44 source: https://github.com/ps5-payload-dev/sdk/archive/refs/tags/v0.44.tar.gz'
            printf '%s\n' 'See LICENSE, THIRD_PARTY_NOTICES.md, README.md, and RELEASING.md in the release source.'
          } > ps5-localsend.elf.SOURCE.txt
          gh release upload "$RELEASE_TAG" ps5-localsend.elf ps5-localsend.elf.sha256 ps5-localsend.elf.SOURCE.txt --clobber
